name: tests

# Runs the unit tests + linter on every push and pull request.
# This does NOT build or deploy the site — GitHub Pages still serves the
# plain files. It only proves the logic is green.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm test
